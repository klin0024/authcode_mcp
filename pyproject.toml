[project]
name = "authcode-mcp"
version = "0.1.0"
description = "FastMCP server: one-time-code Google OAuth + Gmail tools, with a pluggable CacheStore for session storage."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "starlette",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.scripts]
authcode-mcp = "authcode_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authcode_mcp"]
